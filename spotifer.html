<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        crossorigin="anonymous" referrerpolicy="no-referrer">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <title>Spotifer (tailwind)</title>

<body>

    <div class="bg-gradient-to-b from-slate-700 via-slate-900 to-slate-950 fixed inset-0 -z-10">

        <div class=" w-full text-white min-h-screen p-6">




            <!-- ---------------------------ส่วนของ header--------------------------- -->
            <div class=" flex flex-col items-center">

            <!-- ----------------------------ส่วน playlists-------------------------- -->

                <div class="w-full ml-4">
                    <p>Album name</p>

            </div>
            <div class="flex items-center mt-4">
                <img class="w-[40px] rounded-md" src="https://picsum.photos/200" alt="">

                </div>

            </div>
            <div class="flex items-center mt-4">

                <div class="w-full ml-4">
                    <p>Album name</p>
                    <p class="text-xs">100 likes</p>
                </div>
                <i class="fa-solid fa-angle-right"></i>
            </div>
            <div class="flex items-center mt-4">
                <img class="w-[40px] rounded-md" src="https://picsum.photos/200" alt="">
                <div class="w-full ml-4">
                    <p>Album name</p>
                    <p class="text-xs">100 likes</p>
                </div>
                <i class="fa-solid fa-angle-right"></i>
            </div>

            <div class="flex justify-between mt-4">
                <p>See all playlists</p>
                <i class="fa-solid fa-angle-right"></i>
            </div>

        </div>




        <!-- -----------------------ส่วน footer---------------------------- -->
        <div class="flex justify-around fixed bottom-0 w-full text-white py-4">
            <div class="flex flex-col items-center">
                <i class="fa-regular fa-house"></i>
                <p>Home</p>
            </div>

            <div class="flex flex-col items-center">
                <i class="fa-solid fa-magnifying-glass"></i>
                <p>Search</p>
            </div>

            <div class="flex flex-col items-center">
                <i class="fa-solid fa-bars"></i>
